<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code | MessageX</title>

    {% load static %}
    
    <link rel="stylesheet" href="{% static 'chat/chat.css' %}">
    <link rel="icon"
          type="image/png"
          href="{% static 'chat/chat.png' %}">




</head>

<body>
    <main class="login-container page">
        <section class="login-card">
            <div class="logo">
                <img src="{% static 'chat/chat.png' %}" height="40px" width="40px">
            </div>
            <h2>Verify Code</h2>
            {% if error %}
            <p style="color: red; text-align: center; font-weight: bold;">
                {{ error }}
            </p>
            {% endif %}

            <p class="subtitle">Enter the verification code sent to your email</p>

            <form method="POST" action="{% url 'verify_code' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="code">Verification Code</label>
                    <input type="text" id="code" name="code" placeholder="Enter 6-digit code" maxlength="6" required>
                </div>
                <br>
                <button type="submit">Verify Code</button>
            </form>
            <p class="signup">
                Dind't receive the code? <a href="#">Resend Code</a>
            </p>
        </section>
    </main>
    
</body>
</html>
