<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MessageX</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'chat/chat.css' %}">

    <link rel="icon"
          type="image/png"
          href="{% static 'chat/chat.png' %}">

</head>
<body>
    <main class="login-container page">
        <section class="login-card">
            <div class="logo">
                <img src="{% static 'chat/chat.png' %}" height="40px" width="40px">
            </div>
            <h2>Reset Password</h2>
            <p class="subtitle">
               🔒 Create your new password
            </p>
            <form method="POST" action="{% url 'reset_password' %}">
                    {% csrf_token %}
                <div class="form-group">
                    <label for="password">New Password</label>
                    <div class="password-box">
                    <input type="password" id="password" name="password" placeholder="Enter new password" required>
                    <span class="eye" onclick="togglePassword('password',this)">👁️</span>
                    </div>
                </div>

                <br>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="password-box">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                    <span class="eye" onclick="togglePassword('confirm_password',this)">👁️</span>
                    </div>
                </div>
                
                <br> 

                <button type="submit">Reset Password</button>

            </form>
        </section>
    </main>
    

<script src="{% static 'chat/chat.js' %}"></script>

    
</body>
</html>
