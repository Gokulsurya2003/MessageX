<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password  | MessageX</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'chat/chat.css' %}">

    <link rel="icon"
          type="image/png"
          href="{% static 'chat/chat.png' %}">


</head>
<body>
    <main class="login-container page">
        <section class="login-card">
            <div class="logo">
                <img src="{% static 'chat/chat.png' %}" height="40px" width="40px">
            </div>
            <h2>Forgot Password</h2>
            <p class="subtitle">📩 Enter your email to reset your password</p>
            <form method="POST" action="{% url 'forgot_password' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                </div>
                <br>
                <button type="submit">Send Reset Code</button>
            </form>
            <p class="signup">Remember your password? <a href="{% url 'chat' %}">Login</a></p>
        </section>
    </main>
    
    
    
    
    
</body>
</html>
